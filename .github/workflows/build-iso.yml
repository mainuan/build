name: ISO

# lint     every push / pull request: shell syntax, ShellCheck, pinned sources
# build    manual run, v* tags and pull requests that touch the builder:
#          full ISO build on a GitHub-hosted runner, structural checks,
#          UEFI and BIOS live boot tests in QEMU/KVM, SHA256SUMS, artifact
# release  only for a pushed v* tag, after build: GitHub pre-release/release
#          with the ISO split in parts below the 2 GiB asset limit

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant directory under data/
        default: base
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      builder-changed: ${{ steps.changes.outputs.builder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Shell syntax and ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends shellcheck
          bash -n build.sh
          bash -n tests/iso/check-iso.sh
          # Errors only: the builder predates ShellCheck and its style
          # warnings are tracked separately (docs/02).
          shellcheck --severity=error build.sh tests/iso/check-iso.sh
          python3 -m py_compile tests/iso/live-smoke.py

      - name: Every external source is pinned
        run: |
          set -euo pipefail
          for variant in data/*/; do
            deb="${variant}install-deb-packages.lst"
            if [ -f "$deb" ]; then
              sed 's|#.*||' "$deb" | awk 'NF { if (NF != 2 || $2 !~ /^[0-9a-f]{64}$/) { print FILENAME ": " $0; bad=1 } } END { exit bad }' FILENAME="$deb"
            fi
            dots="${variant}git-dot-files.lst"
            if [ -f "$dots" ]; then
              sed 's|#.*||' "$dots" | awk -F'>' 'NF { split($1, a, " "); if (a[1] ~ /\.git$/ ? a[2] !~ /^[0-9a-f]{40}$/ : a[2] !~ /^[0-9a-f]{64}$/) { print FILENAME ": " $0; bad=1 } } END { exit bad }' FILENAME="$dots"
            fi
            ini="${variant}distro.ini"
            # shellcheck disable=SC1090
            ( source "$ini"; [ -n "${base_iso_url:-}" ] && [[ "${base_iso_sha256:-}" =~ ^[0-9a-f]{64}$ ]] && [ -n "${base_iso_signing_key:-}" ] ) \
              || { echo "$ini: base image not pinned"; exit 1; }
          done
          echo "All sources are pinned."

      - name: Did the builder change?
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] && git diff --quiet "$BASE" HEAD -- build.sh data tests .github/workflows/build-iso.yml; then
            echo "builder=false" >> "$GITHUB_OUTPUT"
          else
            echo "builder=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: lint
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'pull_request' && needs.lint.outputs.builder-changed == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      VARIANT: ${{ inputs.variant || 'base' }}
      WORK: /mnt/mainuan-build
    outputs:
      iso-name: ${{ steps.iso.outputs.name }}
      artifact: ${{ steps.iso.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner resources before cleanup
        run: |
          nproc; free -g; df -h / /mnt

      - name: Require enough free disk space
        run: |
          # base ISO 5 GB + squashfs copy + chroot ~15 GB + new squashfs, ISO and
          # parts: about 40 GB. The hosted image has ~88 GB free without cleanup.
          free_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          echo "free: ${free_gb} GB"
          test "$free_gb" -ge 50

      - name: Copy the builder to the work directory
        run: |
          sudo mkdir -p "$WORK"
          sudo rsync -a --delete ./ "$WORK/"
          test "$(git -C "$WORK" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build the ISO (build.sh)
        working-directory: /mnt/mainuan-build
        run: |
          set -o pipefail
          sudo ./build.sh "$VARIANT" 2>&1 | tee build.log
          sudo chown -R "$(id -u):$(id -g)" "$VARIANT/iso"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$VARIANT/release"
          df -h /mnt

      - name: Collect the ISO
        id: iso
        working-directory: /mnt/mainuan-build
        run: |
          set -euo pipefail
          cd "$VARIANT/iso"
          iso="$(ls ./*.iso)"; iso="${iso#./}"
          name="${iso%.iso}"
          sha256sum --check "$iso.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "artifact=iso-$name-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          ls -l

      - name: Split for GitHub Releases (2 GiB per asset) and checksum
        working-directory: /mnt/mainuan-build
        run: |
          set -euo pipefail
          cd "$VARIANT/iso"
          name="${{ steps.iso.outputs.name }}"
          mkdir -p ../release
          split --bytes=1900M --numeric-suffixes=1 --suffix-length=1 "$name.iso" "../release/$name.iso.part"
          cp "$name.packages" "$name.build-info" components.sha256 ../release/
          cd ../release
          { cat "../iso/$name.iso.sha256"; sha256sum "$name".iso.part*; } > SHA256SUMS
          # Reassembling the parts must give back the tested image.
          cat "$name".iso.part* | sha256sum | awk '{print $1}' | grep -qx "$(cut -d' ' -f1 "../iso/$name.iso.sha256")"
          ls -l

      - name: Upload the ISO parts (before the tests, so a failure can be debugged locally)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.iso.outputs.artifact }}
          path: /mnt/mainuan-build/${{ env.VARIANT }}/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Structural checks
        working-directory: /mnt/mainuan-build
        run: |
          sudo apt-get install --yes --no-install-recommends xorriso squashfs-tools file > /dev/null
          set -o pipefail
          bash tests/iso/check-iso.sh "$VARIANT/iso/${{ steps.iso.outputs.name }}.iso" "$RUNNER_TEMP/check-iso" | tee "$VARIANT/iso/check-iso.log"

      - name: Enable KVM for the boot tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf > /dev/null
          ls -l /dev/kvm

      - name: Live boot test (UEFI)
        working-directory: /mnt/mainuan-build
        run: |
          python3 tests/iso/live-smoke.py "$VARIANT/iso/${{ steps.iso.outputs.name }}.iso" \
            --firmware uefi --memory 6144 --cpus 4 --out "$VARIANT/iso/live-uefi"

      - name: Live boot test (BIOS)
        working-directory: /mnt/mainuan-build
        run: |
          python3 tests/iso/live-smoke.py "$VARIANT/iso/${{ steps.iso.outputs.name }}.iso" \
            --firmware bios --memory 6144 --cpus 4 --out "$VARIANT/iso/live-bios"

      - name: Upload logs (also on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /mnt/mainuan-build/build.log
            /mnt/mainuan-build/${{ env.VARIANT }}/iso/check-iso.log
            /mnt/mainuan-build/${{ env.VARIANT }}/iso/live-*/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'mainuan/build'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # No checkout: nothing from the repository runs with write access.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs

      - name: Attach the test reports
        run: |
          set -euo pipefail
          cp logs/base/iso/check-iso.log release/
          for fw in uefi bios; do
            cp "logs/base/iso/live-$fw/report.json" "release/live-$fw-report.json"
          done
          cp logs/base/iso/live-uefi/live.png release/live-uefi.png

      - name: Publish (never replaces an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          NAME: ${{ needs.build.outputs.iso-name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS --ignore-missing
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SHA"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists"; exit 1
          fi
          iso_sha="$(grep "$NAME.iso\$" SHA256SUMS | cut -d' ' -f1)"
          {
            echo "Imagem ISO do **Mainuan Linux** construída a partir do commit \`$SHA\`."
            echo
            echo "| | |"
            echo "|---|---|"
            sed -n 's/^\(version\|base_iso\|kernel\|plasma\|qt\|calamares\)=\(.*\)$/| \1 | \2 |/p' "$NAME.build-info"
            echo "| SHA-256 da ISO | \`$iso_sha\` |"
            echo
            echo "### Download e verificação"
            echo
            echo "O GitHub limita cada arquivo de release a 2 GiB, por isso a ISO foi dividida em partes. Baixe todas as partes e o \`SHA256SUMS\`:"
            echo
            echo '```bash'
            echo "sha256sum --check --ignore-missing SHA256SUMS   # confere as partes"
            echo "cat $NAME.iso.part* > $NAME.iso"
            echo "sha256sum --check --ignore-missing SHA256SUMS   # confere a ISO inteira"
            echo '```'
            echo
            echo "Grave em um pendrive com o KDE ISO Image Writer, o GNOME Disks, o balenaEtcher ou \`dd\`."
            echo
            echo "Os relatórios dos testes automáticos (estrutura da ISO e boot Live em UEFI e BIOS) estão anexados. Consulte as notas da versão no repositório para os testes de instalação e os problemas conhecidos."
          } > ../notes.md
          flags=(--prerelease)
          case "$TAG" in *-rc*|*-beta*|*-alpha*) ;; *) flags=(--latest) ;; esac
          gh release create "$TAG" ./* --verify-tag --title "Mainuan ${TAG#v}" --notes-file ../notes.md "${flags[@]}"
